    <!-- Tema: dark é o padrão. Este script roda antes do CSS para não piscar a cor errada. -->
    <meta name="theme-color" content="#081A2D" />
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('dd:theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch (error) {
          /* localStorage bloqueado: mantém o dark padrão */
        }
      })()
    </script>
    <style>
      /* Evita fundo branco antes do bundle de CSS chegar. */
      html[data-theme='dark'] {
        background: #081a2d;
      }
      html[data-theme='light'] {
        background: #f5f6f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
